# Codex CLI — https://developers.openai.com/codex/cli
#
# Read path: ~/.codex/config.toml. That file also holds project trust levels,
# notice flags, model preferences, and per-tool approval modes. So we never
# write it ourselves — every mutation goes through `codex mcp` / `codex plugin`.
#
# Capability notes, both verified against `codex mcp add --help` (0.146.0):
#
#   * no `--header`   -> arbitrary HTTP headers cannot be expressed. So the
#                        `headers` capability is absent, and a server needing it
#                        is reported as blocked instead of being pushed lossily.
#   * no ambient env forwarding -> `--env` only takes literal KEY=VALUE, so the
#                        `env_from` capability is absent. (config.toml has an
#                        `env_vars` key for this, but no CLI flag reaches it.)
#
# Skills: dirs[0] is the link target. ~/.codex/skills is read-only here because
# it is where Codex installs its own system skills.

name = "codex"
display = "Codex CLI"
detect = { bin = "codex" }

[mcp]
scopes = ["user"]
caps = ["stdio", "http", "env", "bearer_env"]

[[mcp.read]]
file = "~/.codex/config.toml"
parser = "codex_toml_v1"

[mcp.add]
style = "flags"
argv_stdio = ["mcp", "add", "{name}", "{env_flags...}", "--", "{command}", "{args...}"]
argv_http = ["mcp", "add", "{name}", "--url", "{url}", "{bearer_flags...}"]
env_flag = "--env"
env_format = "{key}={value}"
bearer_env_flag = "--bearer-token-env-var"

[mcp.remove]
argv = ["mcp", "remove", "{name}"]

[mcp.login]
argv = ["mcp", "login", "{name}"]

# `codex mcp list --json` reports auth_status per server. The config file cannot:
# it records how to authenticate, never whether a credential exists.
[mcp.auth_status]
argv = ["mcp", "list", "--json"]
parser = "codex_auth_v1"

[instructions]
user = "~/.codex/AGENTS.md"
project = "{repo}/AGENTS.md"
# no `local`: Codex has no counterpart to CLAUDE.local.md, so that scope
# is reported as blocked rather than given an invented location.

[skills]
dirs = ["~/.agents/skills", "~/.codex/skills"]

[plugins]
implicit_marketplaces = ["openai-curated", "openai-api-curated"]

[[plugins.read]]
file = "~/.codex/config.toml"
parser = "codex_plugins_toml_v1"

# `codex plugin add` refuses a bare name ("requires --marketplace unless passed
# as <plugin>@<marketplace>"), so the marketplace must be resolved from these.
[[plugins.catalog]]
glob = "~/.codex/.tmp/marketplaces/*/.claude-plugin/marketplace.json"
parser = "marketplace_manifest_v1"

[[plugins.catalog]]
glob = "~/.codex/.tmp/plugins/.agents/plugins/api_marketplace.json"
parser = "marketplace_manifest_v1"

[[plugins.catalog]]
glob = "~/.codex/.tmp/plugins/.agents/plugins/marketplace.json"
parser = "marketplace_manifest_v1"

[plugins.install]
argv = ["plugin", "add", "{id}"]

[plugins.remove]
argv = ["plugin", "remove", "{id}"]

[plugins.marketplace_add]
argv = ["plugin", "marketplace", "add", "{source}"]

[plugins.marketplace_remove]
argv = ["plugin", "marketplace", "remove", "{name}"]

# Hooks. Verified against codex-cli 0.146.0, whose hook config field table is
# `async asyncRewake shell timeout statusMessage matcher timeoutSec`.
#
# `if` is absent. This is visible from Codex's own state: [hooks.state]
# records the five security-guidance Bash handlers, distinguished only by
# `if`, as post_tool_use:1:0 through :1:4. All five carry *identical*
# trusted_hash values. Codex hashes only the command, so one commit launches
# all five.
#
# `rewake_message` and `rewake_summary` are absent from both lists: neither
# string occurs anywhere in the binary.
[hooks]
events = ["SessionStart", "UserPromptSubmit", "PreToolUse", "PostToolUse",
          "Stop", "SessionEnd"]
caps   = ["matcher", "timeout", "async_rewake"]
output = ["hook_specific_output", "system_message", "additional_context",
          "suppress_output"]

# Codex has no user-level hook file. Hooks reach it only through plugins. A
# hook synced here is therefore delivered as a generated plugin in a local
# marketplace agentsync owns, via `codex plugin marketplace add`.
[hooks.shim]
marketplace = "~/.agentsync/shims/codex"
output_strategy = "codex_v1"
