name: release

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the build without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Linux arm64 needs a cross linker; the others build natively.
      - name: Install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # A binary that cannot run is not a release artifact. Cross-built and
      # non-native targets can only be checked for shape.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' && !matrix.cross
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/agentsync
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version

      # tar on Windows would lose the .exe convention users expect, so Windows
      # ships a zip and everything else a tarball.
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cd "target/$TARGET/release"
          if [ -f agentsync.exe ]; then
            7z a "$GITHUB_WORKSPACE/dist/agentsync-$TAG-$TARGET.zip" agentsync.exe
          else
            tar -czf "$GITHUB_WORKSPACE/dist/agentsync-$TAG-$TARGET.tar.gz" agentsync
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agentsync-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # Nothing to publish for a manual rehearsal.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      # Idempotent: re-running a tag replaces its assets rather than failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
