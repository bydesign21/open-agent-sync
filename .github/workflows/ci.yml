name: ci

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate, on every platform we publish for. An untested platform claim is a
  # guess, and the one genuinely platform-specific thing here — symlinks — differs
  # most on Windows.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # tests/apply_e2e.rs stands up a fake host CLI written in Python. It is
      # unix-only, so this is not needed on Windows.
      - name: Check python3 is available
        if: runner.os != 'Windows'
        run: python3 --version

      - name: Test
        run: cargo test --locked

  # Prove the version in Cargo.toml is actually the minimum. The code uses
  # let-chains, which are stable only from 1.88 in edition 2024, so a lower
  # rust-version would be a claim nothing checks.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cargo.toml is attacker-controlled on a fork PR, so the value is validated
      # against a strict pattern and passed through the environment rather than
      # interpolated into a shell command.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "rust-version is not a plain version number: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"

      - name: Install the declared Rust version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
          rustc --version

      - name: Check
        run: cargo check --locked --all-targets
