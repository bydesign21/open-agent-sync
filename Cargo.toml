[package]
name = "agentsync"
version = "0.0.10"
edition = "2024"
rust-version = "1.88"
description = "Reconcile MCP servers, skills, and plugins across agentic coding CLIs"
license = "MIT"
repository = "https://github.com/bydesign21/open-agent-sync"
readme = "README.md"
keywords = ["mcp", "tui", "claude-code", "codex", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shell-escape = "0.1"
toml = { version = "0.9", features = ["preserve_order"] }
toml_edit = "0.23"
which = "8"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
